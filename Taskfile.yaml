version: '3'

silent: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Compile Java application
    cmds:
      - mvn compile

  run:
    desc: Build and run JVM with Maven dependencies
    cmds:
      - mvn compile exec:java

  redis-up:
    desc: Start Redis in Docker
    cmds:
      - docker compose up -d redis

  redis-down:
    desc: Stop Redis in Docker
    cmds:
      - docker compose down

  run-with-redis:
    desc: Start Redis and run JVM
    deps:
      - redis-up
    cmds:
      - mvn compile exec:java

  clean:
    desc: Clean build files
    cmds:
      - mvn clean

  test:
    desc: Unit-tests
    cmds:
      - mvn test

  test-with-redis:
    desc: Common tests
    deps:
      - redis-up
    cmds:
      - mvn clean verify -Pintegration