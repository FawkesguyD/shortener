version: '3'

silent: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Compile Java application
    cmds:
      - mvn compile

  run:
    desc: Build & Run jvm
    cmds:
      - mvn compile && java -cp target/classes Main

  clean:
    desc: Clean build files
    cmds:
      - mvn clean
