name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check EditorConfig and Spotless
        run: mvn -B -ntp editorconfig:check spotless:check

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run unit and integration tests
        run: mvn -B -ntp clean verify -Pintegration
      - name: Upload verified Maven package
        uses: actions/upload-artifact@v4
        with:
          name: shortener-maven
          path: |
            pom.xml
            target/shortener-*.jar
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
      - uses: actions/download-artifact@v4
        with:
          name: shortener-maven
      - name: Check release version
        shell: bash
        run: |
          version=$(mvn -B -ntp -q -Dstyle.color=never help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Release tag %s must match POM version %s in vX.Y.Z format.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          test -f "target/shortener-$version.jar"
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
        shell: bash
        run: |
          mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DrepositoryId=github \
            "-Durl=https://maven.pkg.github.com/${GITHUB_REPOSITORY,,}" \
            "-Dfile=target/shortener-$RELEASE_VERSION.jar" \
            -DpomFile=pom.xml
